<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joke of the Day | Plutopia</title>
    <meta property="og:title" content="Joke of the Day | Plutopia">
    <meta property="og:description" content="Check out the Plutopia Joke of the Day!">
    <meta property="og:image" content="https://plutopia.info/assets/og-logo.jpg">
    <meta property="og:url" content="https://plutopia.info/dadjoke">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://plutopia.info/assets/og-logo.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&display=swap" rel="stylesheet">
    
    <style>
        /* Embed styles directly to prevent relative path/caching issues on extensionless URLs */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            height: 100%;
            background-color: #050505;
        }

        body.dadjoke-page {
            background-color: #050505;
            background-image: radial-gradient(circle at 50% 50%, rgba(139, 99, 248, 0.08) 0%, transparent 70%);
            width: 100%;
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Bubblegum Sans', cursive;
            color: #ffffff;
            position: relative;
        }

        .dadjoke-main {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            max-width: 900px;
            padding: 24px;
            text-align: center;
            box-sizing: border-box;
        }

        .joke-display {
            display: flex;
            flex-direction: column;
            gap: 24px;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        /* Large Font for Setup */
        .setup-text {
            font-size: 3.5rem;
            font-weight: 600;
            line-height: 1.25;
            color: #ffffff;
            width: 100%;
            word-wrap: break-word;
            display: block;
        }

        .setup-text.one-liner {
            font-size: 3.25rem;
            color: #f1e9ff;
            text-shadow: 0 0 30px rgba(185, 107, 248, 0.15);
        }

        /* Medium Font for Punchline */
        .punchline-text {
            font-size: 2.15rem;
            font-weight: 500;
            background: linear-gradient(90deg, #d39bfb, #7bb0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 45px rgba(185, 107, 248, 0.25);
            line-height: 1.3;
            width: 100%;
            word-wrap: break-word;
            display: block;
            margin-top: 8px;
        }

        /* Animations */
        .fade-in-up {
            animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mobile responsive styles */
        @media (max-width: 768px) {
            .dadjoke-main {
                padding: 16px;
            }

            .setup-text {
                font-size: 2.2rem; /* Big font for mobile */
            }

            .setup-text.one-liner {
                font-size: 2.1rem;
            }

            .punchline-text {
                font-size: 1.55rem; /* Medium font for mobile */
            }
        }
    </style>
</head>
<body class="dadjoke-page">
    <main class="dadjoke-main">
        <div class="joke-display fade-in-up">
            <div id="setup-container" class="setup-text"></div>
            <div id="punchline-container" class="punchline-text"></div>
        </div>
    </main>

    <script src="jokes.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const setupEl = document.getElementById('setup-container');
            const punchlineEl = document.getElementById('punchline-container');

            if (typeof redditJokes !== 'undefined' && redditJokes.length > 0) {
                const today = new Date();
                const seed = today.getFullYear() * 10000 + (today.getMonth() + 1) * 100 + today.getDate();
                const index = Math.abs(seed) % redditJokes.length;
                const joke = redditJokes[index];

                if (joke.q) {
                    setupEl.textContent = joke.q;
                    punchlineEl.textContent = joke.a;
                } else {
                    setupEl.textContent = joke.a;
                    setupEl.classList.add('one-liner');
                    punchlineEl.textContent = '';
                }
            } else {
                setupEl.textContent = "What's the best thing about Switzerland?";
                punchlineEl.textContent = "I don't know, but the flag is a big plus.";
            }
        });
    </script>
</body>
</html>
